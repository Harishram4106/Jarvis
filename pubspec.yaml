name: jarvis
description: JARVIS - Your Intelligent Companion

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # UI
  flutter_animate: ^4.5.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1

  # Android Keystore-backed storage for the API key
  flutter_secure_storage: ^9.2.2
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  url_launcher: ^6.3.2
  battery_plus: ^7.1.1
  device_calendar: ^4.3.3
  timezone: ^0.9.4
  flutter_timezone: ^5.1.0
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/Inter-LICENSE.txt
    - assets/google_fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
